site_name: "Cuerpo, sensor y escena"
site_description: "Documentación técnica — metodologías generativas en tiempo real para artes escénicas y musicales"
site_author: "José"

repo_url: https://github.com/joseurgilesc/Cuerpo-sensor-y-escena
repo_name: "Cuerpo-sensor-y-escena"

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Modo claro

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex
  - pymdownx.keys
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search:
      lang: es

nav:
  - Inicio: index.md
  - "1. Presentación del sistema": 01-presentacion.md
  - "2. Arquitectura general": 02-arquitectura.md
  - "3. Preparación del entorno": 03-preparacion.md
  - "4. Captura corporal: webcam y ml5.js": 04-captura-corporal.md
  - "5. Makey Makey": 05-makey-makey.md
  - "6. Arduino e interfaces físicas": 06-arduino.md
  - "7. Comunicación entre hardware y software": 07-comunicacion.md
  - "8. Visuales generativos": 08-visuales.md
  - "9. Integración sonora con Tone.js": 09-sonido.md
  - "10. Prototipos integrados": 10-prototipos.md
  - "11. Pruebas y validación": 11-pruebas.md
  - "12. Operación y mantenimiento": 12-operacion.md
  - "13. Entrega y transferencia": 13-entrega.md
  - Glosario técnico: glosario.md
